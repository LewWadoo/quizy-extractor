dedup:
  # manual > perfect > needs_agent_review > needs_human_review.
  # needs_human_review ranks lowest: those entries are known-bad
  # (agents gave up), so any other copy is preferred.
  quality_rank: { manual: 4, perfect: 3, needs_agent_review: 2, needs_human_review: 1 }

review:
  accept_threshold: 90
